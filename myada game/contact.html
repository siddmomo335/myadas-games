<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | GameZone</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">GameZone</a>
    <button class="menu-toggle" aria-label="Open navigation">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-content contact-page">
    <h1>Contact Us</h1>
    <p>Send us your ideas, game suggestions, or any content you want to see on the site.</p>
    <img class="contact-image" src="https://images.unsplash.com/photo-1511512578047-dfb367046420?fit=crop&w=900&q=80" alt="Contact gaming" />
    <form class="contact-form">
      <label>Your Name
          <input class="input-box" name="name" id="name" type="text" placeholder="Enter your name" required />
      </label>
      <label>Email Address
          <input class="input-box" name="email" id="email" type="email" placeholder="example@mail.com" required />
      </label>
      <label>Your Message
        <textarea rows="5" placeholder="Write your message here" required></textarea>
      </label>
      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 GameZone. Clean and modern design for gamers.</p>
  </footer>
</body>
</html>
